# mkdocs.yml -- documentation navigable d'IAO (règle d'équipe Mathide-Team,
# même modèle que Netcross).
#
# Pas de copie : les pages reprennent des sections du README, FEATURES.md et
# CHANGES.md par inclusion (pymdownx.snippets, repères <!-- --8<-- [start:…] -->
# invisibles sur GitHub). check_paths : un fichier ou une section disparus
# font échouer la construction.
#
# En local : uv run --with mkdocs-material mkdocs serve
# En CI : mkdocs build --strict (bloque sur lien mort). Pas de site_url :
# la documentation n'est pas publiée (pas de GitHub Pages).

site_name: IAO
site_description: >-
  Poste de travail de bureau (Windows et Linux) pour utiliser plusieurs
  services d'IA web avec plusieurs comptes isolés, en onglets intégrés.
repo_url: https://github.com/Mathide-Team/IAO
repo_name: Mathide-Team/IAO
docs_dir: docs

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Mode clair

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Accueil: index.md
  - Guide utilisateur:
      - Installation: installation.md
      - Données et dépannage: donnees-et-depannage.md
      - Langue de l'interface: i18n.md
  - Développement:
      - Structure, sécurité, contribuer: developpement.md
      - Contexte du projet: PROJECT_CONTEXT.md
      - Travaux à faire: fonctionnalites.md
      - Historique des modifications: changements.md
