# Tests d'intégration Electron (harnais réel sous xvfb).
#
# BLOQUANT depuis l'issue #54 : la régression #52 (preload sandboxé qui ne
# s'exécutait plus, interface vide) était signalée ici dès le 22/09 mais le
# job était en continue-on-error et n'empêchait aucun merge. Chaque étape
# échoue désormais le job, et « Harnais Electron (xvfb) » est un check requis
# sur dev et main (protection de branche).
name: Tests Electron (intégration)

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  tests-electron:
    name: Harnais Electron (xvfb)
    runs-on: ${{ fromJSON(vars.IAO_RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}
    timeout-minutes: 20

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances (npm ci)
        run: npm ci

      - name: Installation de xvfb et des bibliothèques d'Electron
        # Runners « maison » : conteneurs Ubuntu minimaux (root, sans sudo) ou
        # VM `ubuntu` (compte non root, sudo avec mot de passe). Rien à
        # installer si tout est déjà présent ; sinon `sudo -n` échoue tout de
        # suite au lieu d'attendre un mot de passe (sudo: timed out après 5 min).
        run: |
          PAQUETS="xvfb xauth libnss3 libgbm1 libgtk-3-0 libxss1 libxtst6 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxshmfence1 libsecret-1-0 libcups2 libnotify4 libuuid1 fonts-dejavu-core"
          manquants=""
          installe() {  # Ubuntu >= 24.04 : nom réel souvent suffixé t64 (libgtk-3-0t64...)
            for n in "$1" "${1}t64"; do
              dpkg-query -W -f='${Status}' "$n" 2>/dev/null | grep -q "install ok installed" && return 0
            done
            return 1
          }
          for p in $PAQUETS libasound2; do
            installe "$p" || manquants="$manquants $p"
          done
          if [ -z "$manquants" ]; then
            echo "Bibliothèques déjà installées : rien à faire."
            exit 0
          fi
          SUDO=""
          if [ "$(id -u)" != "0" ]; then
            if ! sudo -n true 2>/dev/null; then
              echo "::error::Paquets manquants :$manquants -- sudo demande un mot de passe sur ce runner ($RUNNER_NAME). Les préinstaller, ou autoriser sudo sans mot de passe pour le compte du runner."
              exit 1
            fi
            SUDO="sudo -n"
          fi
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends $PAQUETS
          $SUDO apt-get install -y --no-install-recommends libasound2t64 \
            || $SUDO apt-get install -y --no-install-recommends libasound2

      - name: Tests d'intégration Electron (popups + Continuer)
        run: npm run test:electron

      - name: Tests d'intégration Electron (identifiants partagés, #278)
        run: npm run test:electron:identifiants

      - name: Tests UI Electron (comptes, onglets, réglages, explorateur)
        env:
          # C7.5 (issue #51) : captures fr / ar et rapport de la vérification RTL.
          IAO_CAPTURES_DIR: ${{ runner.temp }}/iao-captures
        run: npm run test:electron:ui

      - name: Publication des captures RTL (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-rtl
          path: ${{ runner.temp }}/iao-captures
          if-no-files-found: ignore
          retention-days: 14

      - name: Construction du binaire Linux (electron-packager)
        run: npm run dist:linux

      - name: Fumée du binaire packagé (Linux)
        run: npm run test:electron:smoke
