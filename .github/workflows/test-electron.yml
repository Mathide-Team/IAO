# Tests d'intégration Electron (harnais réel sous xvfb).
#
# BLOQUANT depuis l'issue #54 : la régression #52 (preload sandboxé qui ne
# s'exécutait plus, interface vide) était signalée ici dès le 22/09 mais le
# job était en continue-on-error et n'empêchait aucun merge. Chaque étape
# échoue désormais le job, et « Harnais Electron (xvfb) » est un check requis
# sur dev et main (protection de branche).
name: Tests Electron (intégration)

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  tests-electron:
    name: Harnais Electron (xvfb)
    runs-on: ${{ fromJSON(vars.IAO_RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}
    timeout-minutes: 20

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances (npm ci)
        run: npm ci

      - name: Installation de xvfb et des bibliothèques d'Electron
        # Runners « maison » : conteneurs Ubuntu minimaux, en root et sans sudo,
        # sans les bibliothèques graphiques préinstallées sur ubuntu-latest.
        # La liste couvre aussi ubuntu-latest (sudo y est présent).
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends xvfb xauth \
            libnss3 libgbm1 libgtk-3-0 libxss1 libxtst6 libatk-bridge2.0-0 \
            libdrm2 libxkbcommon0 libxshmfence1 libsecret-1-0 libcups2 \
            libnotify4 libuuid1 fonts-dejavu-core
          $SUDO apt-get install -y --no-install-recommends libasound2t64 \
            || $SUDO apt-get install -y --no-install-recommends libasound2

      - name: Tests d'intégration Electron (popups + Continuer)
        run: npm run test:electron

      - name: Tests UI Electron (comptes, onglets, réglages, explorateur)
        run: npm run test:electron:ui

      - name: Construction du binaire Linux (electron-packager)
        run: npm run dist:linux

      - name: Fumée du binaire packagé (Linux)
        run: npm run test:electron:smoke
