name: CI

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  qualite:
    name: Qualité (tests + couverture + audit npm)
    runs-on: ${{ fromJSON(vars.IAO_RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation des dépendances (npm ci)
        run: npm ci

      - name: Tests unitaires avec couverture (node --test --experimental-test-coverage)
        # pipefail : sans lui, le code de sortie est celui de tee (toujours 0)
        # et un test en échec laissait le job vert.
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage-output.txt

      - name: Extraction du résumé de couverture
        run: |
          echo "## Couverture de code" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A 100 "^# start of coverage report" coverage-output.txt | grep -B 100 "^# end of coverage report" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Ligne de résumé
          grep "^# all files" coverage-output.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Audit npm (dépendances production)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Publication du rapport de couverture (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-output.txt
          retention-days: 14
          if-no-files-found: warn
